<style>
  :root{--bg:#121214;--card:#1c1c20;--text:#f4f4f6;--muted:#a1a1aa;--gold:#e8a33d;--line:#2c2c32}
  @media (prefers-color-scheme: light){:root{--bg:#f6f4ef;--card:#fff;--text:#18181b;--muted:#6b6b72;--line:#e7e2d8}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;text-align:center}
  .icon{font-size:44px}
  h1{font-size:22px;margin:10px 0 6px}
  .sub{color:var(--muted);margin:0 0 18px}
  .group{font-weight:700;font-size:18px;margin:6px 0 2px}
  .members{color:var(--muted);font-size:14px;margin-bottom:20px}
  a.btn,button.btn{display:block;width:100%;padding:14px;border-radius:14px;border:0;font-weight:600;font-size:16px;text-decoration:none;margin:10px 0;cursor:pointer}
  .primary{background:var(--gold);color:#111}
  .secondary{background:transparent;color:var(--text);border:1px solid var(--line)!important}
  .code{font:700 28px ui-monospace,Menlo,monospace;letter-spacing:6px;margin:6px 0}
  .hint{color:var(--muted);font-size:13px;margin-top:14px}
  .hidden{display:none}
</style>
</head>

<main class="card">
  <div class="icon">🗓️</div>
  <h1 id="title">You're invited</h1>
  <p class="sub" id="sub">Count down to the moments that matter, together.</p>
  <div id="groupBox" class="hidden">
    <div class="group" id="group"></div>
    <div class="members" id="members"></div>
  </div>
  <div id="invalid" class="hidden sub"></div>

  <div id="actions">
    <a class="btn primary" id="getApp" href="#">Get the app</a>
    <a class="btn secondary" id="openApp" href="#">I have the app — open invite</a>
    <div class="hint" id="codeLabel">Your invite code</div>
    <div class="code" id="code">——————</div>
    <button class="btn secondary" id="copy">Copy invite</button>
    <div class="hint" id="after">After installing, open the app and tap “Paste invite”.</div>
  </div>
</main>
